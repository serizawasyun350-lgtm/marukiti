<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルール | まるきち鯖</title>
  <style>
    body { 
      font-family: sans-serif; 
      background-color: #36393f; 
      color: #ffffff; 
      padding: 40px 20px; 
      max-width: 600px; 
      margin: 0 auto; 
      line-height: 1.6;
    }
    h1 { 
      color: #5865f2; 
      border-bottom: 2px solid #5865f2; 
      padding-bottom: 10px; 
    }
    h2 { 
      color: #ffffff; 
      font-size: 1.1rem; 
      margin-top: 15px; 
      background-color: #2f3136; 
      padding: 12px; 
      border-radius: 5px; 
    }
    .admin-list { 
      color: #00ebba; 
      font-weight: bold; 
    }
    .agree-box {
      margin-top: 30px;
      padding: 20px;
      background-color: #202225;
      border-radius: 8px;
      text-align: center;
    }
    .agree-label {
      font-size: 1rem;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 15px;
    }
    .btn-join {
      display: inline-block;
      padding: 12px 24px;
      background-color: #5865f2;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0.4;
      transition: all 0.3s ease;
    }
    /* チェックを入れるとボタンを有効化 */
    #agree-check:checked ~ .btn-join {
      pointer-events: auto;
      opacity: 1;
    }
    .btn-join:hover { background-color: #4752c4; }
    .back-btn { 
      display: block; 
      margin-top: 25px; 
      color: #b9bbbe; 
      text-decoration: none; 
      text-align: center;
    }
    .back-btn:hover { color: #ffffff; }
  </style>
</head>
<body>
  <h1>まるきち鯖 ルール</h1>

  <h2>1. 仲良くする（冷笑禁止）</h2>
  <h2>2. 嫌なことをしない</h2>
  <h2>3. 迷惑行為をしない</h2>
  <h2>4. 嫌な事があったら管理人に言う</h2>
  <p style="padding-left: 12px; color: #dcddde;">管理者: <span class="admin-list">ちいはや、こなた、たこ</span></p>

  <div class="agree-box">
    <input type="checkbox" id="agree-check">
    <label for="agree-check" class="agree-label">上記のルールに同意します</label>
    <br>
    <a href="https://discord.gg/marukichi" class="btn-join" target="_blank">同意してDiscordサーバーに参加する</a>
  </div>

  <a href="index.html" class="back-btn">← トップページに戻る</a>
</body>
</html>
